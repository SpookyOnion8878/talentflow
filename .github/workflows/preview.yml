name: Preview Verification

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  preview:
    name: PR Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm turbo run build --filter=@repo/email
      - run: pnpm turbo run check-types
      - run: pnpm turbo run test
      - name: Preview deploy note
        run: |
          echo "Previews deploy automatically via the Vercel GitHub integration for every PR."
          echo "To deploy previews from CI instead, add VERCEL_TOKEN / VERCEL_ORG_ID /"
          echo "VERCEL_WEB_PROJECT_ID secrets and re-add a vercel-action step."
